---
name: Test Docker Buildx Action

on:
  push:
    branches: [test/docker-buildx-action]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check out github-actions (for private action)
        uses: actions/checkout@v4
        with:
          repository: hagzag/github-actions
          path: github-actions
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Verify action files exist
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of current directory:"
          ls -la
          echo "---"
          echo "Contents of github-actions:"
          ls -la github-actions/ || echo "github-actions directory not found"
          echo "---"
          echo "Contents of .github/actions/docker-buildx:"
          ls -la .github/actions/docker-buildx/ || echo "Local docker-buildx not found"

      - name: Build Docker image with buildx (multi-arch dry-run)
        uses: ./github-actions/.github/actions/docker-buildx
        with:
          image-name: ghcr.io/${{ github.repository }}
          platforms: linux/amd64,linux/arm64
          dockerfile: Dockerfile
          build-context: .
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Display build summary
        run: |
          echo "✅ Docker buildx test successful!"
          echo "Image: ghcr.io/${{ github.repository }}"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "Commit SHA: ${{ github.sha }}"
