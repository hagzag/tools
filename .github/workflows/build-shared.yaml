name: Build & publish tools image (using shared composite actions)
# hagzag/tools is PUBLIC; hagzag/github-actions is PRIVATE. GitHub does not allow
# a public repo to call a private reusable workflow, so we check the private repo
# out (pinned SHA, read-only token) and run its composite actions locally.
#
# Prerequisite (owner): Actions secret GH_TOKEN = fine-grained PAT, resource owner
# hagzag, repository access ONLY hagzag/github-actions, permission Contents: read.
# See https://github.com/hagzag/tools/issues/12

on:
  push:
    branches: [main, "feature/**", "fix/**", "test/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Pinned commit of hagzag/github-actions that contains the composite actions.
  # Bump via PR after reviewing the diff in the private repo.
  GITHUB_ACTIONS_SHA: "d663bce20d7616f4023428dc664e56d3a74487c1"
  # The supply-chain job runs in a prior published tools image (syft, grype, cosign baked in).
  # `container.image` cannot read env, so it is set literally below; pin by digest via Renovate.

jobs:
  meta:
    name: Compute tags
    # Secrets are not available to PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      push: ${{ steps.meta.outputs.push }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tags=${IMAGE_NAME}:main,${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

  # Each architecture builds natively on its own runner (no QEMU emulation:
  # node/npm crash with SIGILL under QEMU on arm64). Per-arch images are pushed
  # under arch-suffixed tags and merged into one multi-arch index by `build`.
  build-arch:
    name: Build image (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Check out shared actions (private repo, pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: hagzag/github-actions
          ref: ${{ env.GITHUB_ACTIONS_SHA }}
          path: .shared-actions
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Arch-suffixed tags
        id: arch_tags
        run: |
          set -euo pipefail
          # Per-arch tags only; the final tags are applied by the merge job.
          echo "tags=${IMAGE_NAME}:sha-${{ needs.meta.outputs.short_sha }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: ./.shared-actions/.github/actions/docker-build-release
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.arch_tags.outputs.tags }}
          push: ${{ needs.meta.outputs.push }}
          platforms: ${{ matrix.platform }}
          registry-url: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            TERRAFORM_VERSION=1.14.8
            TERRAGRUNT_VERSION=1.0.1
            SEMANTIC_RELEASE_VERSION=25.0.9

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build image
    needs: [meta, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.index.outputs.ref }}
      push: ${{ needs.meta.outputs.push }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: needs.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into one multi-arch index
        id: index
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
          PUSH: ${{ needs.meta.outputs.push }}
        run: |
          set -euo pipefail
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          echo "amd64=${amd64} arm64=${arm64}"
          if [ "${PUSH}" != "true" ]; then
            echo "push=false: both native legs built; nothing to merge."
            exit 0
          fi
          args=()
          IFS=',' read -ra tag_list <<< "${TAGS}"
          for t in "${tag_list[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE_NAME}@${amd64}" "${IMAGE_NAME}@${arm64}"
          first="${tag_list[0]}"
          digest="$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ref=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Multi-arch index: ${IMAGE_NAME}@${digest}"
          docker buildx imagetools inspect "${IMAGE_NAME}@${digest}"

  supply-chain:
    name: SBOM, scan, sign, verify
    needs: build
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
      security-events: write
    # Runs inside a previously published tools image: nothing is installed here.
    # Bootstrap note: until an image containing syft/grype/cosign is published,
    # the first run on main fails at "Check required tools"; re-run after it.
    container:
      image: ghcr.io/hagzag/tools:main # pin by digest, see SUPPLY_CHAIN_IMAGE note above
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out shared actions (private repo, pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: hagzag/github-actions
          ref: ${{ env.GITHUB_ACTIONS_SHA }}
          path: .shared-actions
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Log in to registry for cosign
        run: |
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$HOME/.docker/config.json"

      - name: SBOM, scan, sign, verify
        uses: ./.shared-actions/.github/actions/image-supply-chain
        with:
          image-ref: ${{ needs.build.outputs.ref }}
          grype-config: .grype.yaml
          identity-regexp: '^https://github.com/hagzag/'

  smoke:
    name: Smoke-test tools inside image
    needs: [build, supply-chain]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: terraform -version
      - run: terragrunt --version
      - run: aws --version
      - run: jq --version
      - run: syft version
      - run: grype version
      - run: cosign version
      - run: semantic-release --version
      - name: required semantic-release plugins present
        run: |
          set -euo pipefail
          npm ls -g --depth=0 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/exec \
            @semantic-release/github \
            @semantic-release/gitlab
