name: Build & publish tools image (using shared workflow)
# Calls docker-build-release from github-actions shared workflows

on:
  push:
    branches: [main, "feature/**", "fix/**", "test/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: hagzag/github-actions/.github/workflows/docker-build-release.yaml@main
    with:
      image-name: ghcr.io/${{ github.repository }}
      dockerfile: Dockerfile
      build-context: .
      platforms: linux/amd64,linux/arm64
      build-args: |
        TERRAFORM_VERSION=1.14.8
        TERRAGRUNT_VERSION=1.0.1
        SEMANTIC_RELEASE_VERSION=24.2.3
      registry-url: ghcr.io
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Smoke-test tools inside image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.primary-tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: terraform
        run: terraform -version
      - name: terragrunt
        run: terragrunt --version
      - name: aws
        run: aws --version
      - name: jq
        run: jq --version
      - name: semantic-release CLI
        run: semantic-release --version
      - name: required semantic-release plugins present
        run: |
          set -euo pipefail
          npm ls -g --depth=0 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/exec \
            @semantic-release/github \
            @semantic-release/gitlab
